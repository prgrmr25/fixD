name: GarageSignal
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: "0.1.0"
packages:
  DiagnosticsCore:
    path: DiagnosticsCore
targets:
  GarageSignal:
    type: application
    platform: iOS
    sources:
      - GarageSignal
    dependencies:
      - package: DiagnosticsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayub.garagesignalobd
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Garage Signal OBD
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Garage Signal uses Bluetooth to discover your diagnostic adapter and read vehicle data when you start a scan.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GarageSignalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GarageSignalUITests
    dependencies:
      - target: GarageSignal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ayub.garagesignalobd.uitests
schemes:
  GarageSignal:
    build:
      targets:
        GarageSignal: all
        GarageSignalUITests: [test]
    test:
      targets:
        - GarageSignalUITests
    run:
      config: Debug
    archive:
      config: Release
